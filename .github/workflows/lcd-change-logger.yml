name: LCD Change Logger

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: lcd-change-logger
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check LCD for changes
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          LCD_DATA_URL: https://api-lcd.vercel.app/levels
        run: node scripts/check-changes.mjs

      - name: Save new LCD snapshot
        run: |
          if git diff --quiet; then
            echo "No snapshot changes."
            exit 0
          fi

          git config user.name "LCD Logger"
          git config user.email "actions@users.noreply.github.com"

          git add state/lcd-snapshot.json
          git commit -m "Update LCD snapshot"
          git push
